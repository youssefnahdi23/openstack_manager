services:
  backend:
    build: ./backend
    container_name: vm-backend
    ports:
      - '8000:8000'
    env_file:
      - ./backend/openstack.env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: vm-frontend
    ports:
      - '5173:5173'

  db:
    image: postgres:16
    container_name: vm-db
    environment:
      POSTGRES_DB: vmportal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'

  nginx:
    image: nginx:latest
    container_name: vm-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  redis:
    image: redis:7-alpine
    container_name: vm-redis

  prometheus:
    image: prom/prometheus
    container_name: vm-prometheus
    ports:
      - '9090:9090'

  # grafana:
  #   image: grafana/grafana
  #   container_name: vm-grafana
  #   ports:
  #     - '3000:3000'

  novnc:
    image: theasp/novnc
    container_name: vm-novnc
    ports:
      - '6080:6080'

  ttyd:
    image: tsl0922/ttyd
    container_name: vm-ttyd
    ports:
      - '7681:7681'