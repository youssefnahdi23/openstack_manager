global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'openstack_exporter'
    static_configs:
      - targets: ['localhost:9898']

  - job_name: 'openstack_manager_backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:5000']

  - job_name: 'openstack_manager_frontend'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:3000']
