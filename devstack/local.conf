[[local|localrc]]
# Basic DevStack configuration for the OpenStack Manager project
# Update HOST_IP to the IP address of your DevStack VM or host
HOST_IP=127.0.0.1
SERVICE_HOST=$HOST_IP
MYSQL_HOST=$HOST_IP
RABBIT_HOST=$HOST_IP
KEYSTONE_ADMIN_TOKEN=SuperSecretToken
ADMIN_PASSWORD=DevStackPass
DATABASE_PASSWORD=DevStackDBPass
RABBIT_PASSWORD=DevStackRabbitPass
SERVICE_PASSWORD=DevStackServicePass

# Enable services used by the project
ENABLED_SERVICES=g-api,g-reg,key,n-api,n-crt,n-obj,n-cpu,n-sch,n-novnc,n-cond,n-cauth,horizon

# Neutron configuration
disable_service n-net
enable_service q-svc
enable_service q-agt
enable_service q-dhcp
enable_service q-l3
enable_service q-meta

# Optional infrastructure monitoring services
enable_service prometheus
enable_service ceilometer

# Logging and verbosity
LOGFILE=$DEST/logs/stack.sh.log
LOGDAYS=2

# Local developer settings
VIRT_DRIVER=kvm
LOCALCONF_DIR=$DEST/devstack/local.conf

# Uncomment and update if using a specific network interface
#HOST_IP=<your-host-ip>
#Q_HOST=<your-host-ip>
