services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: vm-portal-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vm_portal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vm-portal-network
    restart: unless-stopped

  # Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: vm-portal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vm-portal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Flask Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vm-portal-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-vm_portal}
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-change-in-production}
      OPENSTACK_AUTH_URL: ${OPENSTACK_AUTH_URL:?Please set OPENSTACK_AUTH_URL to the OpenStack identity endpoint (e.g. http://192.168.91.128/identity)}
      OPENSTACK_USERNAME: ${OPENSTACK_USERNAME:-admin}
      OPENSTACK_PASSWORD: ${OPENSTACK_PASSWORD:-pfestack26}
      OPENSTACK_PROJECT_NAME: ${OPENSTACK_PROJECT_NAME:-admin}
      OPENSTACK_USER_DOMAIN_NAME: ${OPENSTACK_USER_DOMAIN_NAME:-Default}
      OPENSTACK_PROJECT_DOMAIN_NAME: ${OPENSTACK_PROJECT_DOMAIN_NAME:-Default}
      OPENSTACK_REGION_NAME: ${OPENSTACK_REGION_NAME:-RegionOne}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Optional email provider configuration
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-VM Portal}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-no-reply@example.com}
      SMTP_SERVER: ${SMTP_SERVER:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-ae9633001@smtp-brevo.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-True}
    ports:
      - "5000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - vm-portal-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vm-portal-frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_TIMEOUT: 30000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.js:/app/vite.config.js:ro
    networks:
      - vm-portal-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vm-portal-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for HTTPS support
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - vm-portal-network
    restart: unless-stopped

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: vm-portal-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      - TZ=UTC
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - vm-portal-network
    restart: unless-stopped

  # noVNC Console
  # The deprecated ttyd service has been removed, so only noVNC remains here.
  novnc:
    image: theasp/novnc:latest
    container_name: vm-portal-novnc
    environment:
      VNC_SERVER: ${VNC_SERVER:-localhost:5900}
      NOVNC_PORT: 6080
    ports:
      - "6080:8080"
    networks:
      - vm-portal-network
    restart: unless-stopped

networks:
  vm-portal-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
